aid: gangkhar
name: Gangkhar
description: >-
  Gangkhar is an AI-native embedded protection infrastructure platform that lets digital
  platforms, insurers, MGAs, and brokers configure, launch, and continuously optimize
  embedded insurance products globally through a single infrastructure layer and API. Its
  Sherpa+ engine provides full-stack embedded protection rails covering onboarding, pricing,
  underwriting, and claims across multiple carriers and markets, while Sherpa+Lens applies
  real-time AI optimization to pricing, messaging, and product versions. The platform enables
  sectors like mobility, delivery, fintech, e-commerce, travel, health, and vertical SaaS to
  embed compliant protection directly into their customer experiences without becoming
  insurers themselves. Founded in 2025 and led by former Chubb executive Federico Spagnoli,
  Gangkhar closed a $4.25M seed round in March 2026 led by Anthemis. Surfaced as an Anthemis
  portfolio company and enriched into the API Evangelist network.
