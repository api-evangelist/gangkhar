  live, public site content. This is the Wix Site MCP surface (business details, site
  search, bookings/checkout), NOT a first-party MCP server over the Sherpa+ embedded
  protection API — Gangkhar publishes no public developer portal or OpenAPI at this time.
transport: remote
endpoint: https://www.gangkhar.com/_api/mcp
authentication: none
notes:
- No authentication is required to connect to the MCP endpoint.
- Only public information accessible on the site is available.
- Content is always live and up to date.
docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, and address.
  parameters: []
- name: SearchInSite
  description: Searches the site for information.
  parameters:
  - name: searchTerm
    description: The term to search for in the site.
- name: SearchSiteApiDocs
  description: >-
    Retrieves the API documentation for the Wix business solutions installed on this site
    and informs the AI client how to use the APIs.
  parameters:
  - name: searchTerm
    description: The term to search for in the site API documentation.
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the site.
  parameters: []
- name: CallWixSiteAPI
  description: >-
    Calls API methods on the site to perform actions on a visitor's behalf, such as querying
    site data, booking an appointment, or starting a purchase.
  parameters:
  - name: visitorToken
    description: Visitor access token. Use GenerateVisitorToken first if not available.
